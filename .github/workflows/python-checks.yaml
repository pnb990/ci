---

# Lints and tests the python tooling of a repository. No firmware is built
# here, so the toolchain image is not needed and the much smaller python3 one
# is used instead.
#
# This is the single copy of what used to be `test-python.yaml`, duplicated in
# four projects -- two of which ran no linter at all under that name, which is
# what this workflow exists to make impossible.
#
# The REUSE check is *not* here: it lives in lint-reuse.yaml, as its own job.
# See the comment at the top of that file for why -- in short, licence headers
# are not a python matter, and a job is what is visible in the run list.
#
# Callers keep their own trigger and their own image pin; see README.md.

"on":
  workflow_call:
    inputs:
      image:
        description: >-
          Full reference of the python3 image, pinned to a commit tag. Stays in
          the calling project: a pin is a commit in the repository it protects.
        type: string
        required: true
      test:
        description: >-
          Test command, run last, inside the image, after the linters. Empty
          means the project has no test step. This is the one legitimate
          per-project variation.
        type: string
        default: ""
      submodules:
        description: >-
          Passed to actions/checkout. `recursive` is what a path dependency on
          a sibling library needs; `false` for a project without submodules.
        type: string
        default: "recursive"

jobs:
  python-checks:
    # node for the JavaScript actions, git, uv and the `file` command that
    # reuse needs for libmagic all come from the image, built by
    # soft-lib/docker-images. Pinned to a commit tag by the caller, not to
    # `ci-latest`: a workflow that gates a push must not be able to break on a
    # commit that has nothing to do with it. Bumping the pin is a reviewable
    # commit in the project, rolling back is a git revert, and
    # check-image-bump.yaml is what says when the bump is safe.
    runs-on: debian
    container:
      image: ${{ inputs.image }}
    steps:
      # The tag is already the commit here, but the stamp is what proves the
      # image really is that build, and it is the same step as in
      # check-image-bump.yaml, where the tag floats.
      #
      # The `||` does not fail the job, and its message names the one cause
      # that is actionable. /etc/image-info replaced /etc/pnb-image in
      # docker-images, in a single round with no transition: an image missing
      # it is either older than the stamp itself, or a pin that was not bumped
      # along with the rename.
      - name: Image provenance
        run: |
          cat /etc/image-info 2>/dev/null \
            || echo "no /etc/image-info: pin not bumped with the rename, or image older than the stamp"

      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      # --locked, not --frozen. Both install exactly what uv.lock says; the
      # difference is what they do when the lock no longer matches
      # pyproject.toml. --frozen does not look at pyproject.toml at all, so it
      # installs the stale lock and says nothing -- which is what happened in
      # pnbchrono, whose lock still listed black and pycodestyle months after
      # the migration to ruff, while the comment that stood here claimed
      # --frozen was what made that fail. --locked asserts the lock is up to
      # date and fails the run when it is not.
      #
      # A red job here means one command: `uv lock`, then commit the result.
      #
      # --dev, because the linters below are dev dependencies and `uv sync`
      # alone would not install them.
      - name: Install dependencies
        run: uv sync --dev --locked

      # One step per tool, where a python script (tests/test.py) used to drive
      # all of them through unittest. That script predates this CI; now that
      # the CI exists, running the tools directly means a red job names what
      # broke, and each tool reads its own configuration instead of a
      # hand-written file list.
      #
      # ruff replaces pycodestyle, which could not be configured from
      # pyproject.toml at all -- it only reads setup.cfg / tox.ini, so the
      # ignore list projects carried under [tool.black] was read by nobody and
      # E203 fired on every slice black had formatted.
      - name: Lint
        run: uv run ruff check .

      # Nothing here duplicates the step above: ruff check leaves out the rules
      # that would disagree with the formatter, and the formatter owns the
      # layout. `ruff format` replaced black, whose output it matches, so
      # line-length is now written once, under [tool.ruff].
      - name: Check formatting
        run: uv run ruff format --check --diff .

      # What ruff does not cover: design rules, docstrings, dead code across
      # modules. --recursive because it is given a tree, not a file list; the
      # exclusions live in pyproject.toml, next to ruff's.
      - name: Coding rules
        run: uv run pylint --recursive=y .

      # Last, so a failing test is read against an already-linted tree.
      - name: Run tests
        if: inputs.test != ''
        run: ${{ inputs.test }}
