---

# Builds one firmware configuration inside the toolchain image, optionally
# uploading an artifact. The caller keeps its matrix, its trigger, the image
# pin and the build's environment: those are project knowledge.

"on":
  workflow_call:
    inputs:
      image:
        description: Toolchain image, pinned to a commit tag by the caller.
        type: string
        required: true
      build:
        description: >-
          The build command, multi-line allowed. It exports what the project's
          build system needs, e.g.
          `export TOOLCHAIN_STM32_DIR="$ARM_TOOLCHAIN_DIR"`.
        type: string
        required: true
      matrix-value:
        description: >-
          The expanded matrix value (`${{ matrix.preset }}`); names the job
          and is checked by `require-matrix`.
        type: string
        default: ""
      require-matrix:
        description: >-
          Fail on an empty `matrix-value`: only the caller knows whether empty
          means "no matrix" or "matrix failed to expand".
        type: boolean
        default: false
      submodules:
        description: Passed to actions/checkout.
        type: string
        default: "recursive"
      uv-sync:
        description: >-
          Install the project's python environment before the build. `false`
          for a project with no pyproject.toml.
        type: boolean
        default: true
      clang-tidy:
        description: >-
          Run clang-tidy, with `-Wdocumentation`, over the compilation database
          after the build. Any finding fails the job.
        type: boolean
        default: true
      compile-commands-dir:
        description: >-
          Directory of the `compile_commands.json` the build wrote, relative to
          the checkout.
        type: string
        default: "."
      clang-tidy-files:
        description: >-
          Python regex of the database files to analyse. The default skips
          assembly startup files, which clang-tidy rejects.
        type: string
        default: '\.(c|cc|cpp|cxx)$'
      artifact-name:
        description: Name of the artifact to upload; empty uploads nothing.
        type: string
        default: ""
      artifact-path:
        description: >-
          What to upload, as upload-artifact reads it: one path or glob per
          line, `**` allowed. Required when artifact-name is set.
        type: string
        default: ""
      artifact-retention-days:
        description: How long the forge keeps the artifact.
        type: number
        default: 30

jobs:
  fw-build:
    # Without it, every matrix job of the caller is listed as `fw-build`.
    name: fw-build ${{ inputs.matrix-value }}

    runs-on: debian
    container:
      image: ${{ inputs.image }}

    steps:
      # act_runner can plan a dynamic matrix before its `prepare` job has
      # published, giving one job with an empty value: fail here, not with a
      # confusing "No preset specified" from the build.
      - name: Check the matrix expanded
        if: inputs.require-matrix && inputs.matrix-value == ''
        run: |
          echo "empty matrix value: the dynamic matrix did not expand." >&2
          echo "Check the 'Detected …' line of the prepare job." >&2
          exit 1

      - name: Image provenance
        run: |
          cat /etc/image-info 2>/dev/null \
            || echo "no /etc/image-info: pin not bumped with the rename, or image older than the stamp"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      # --locked, not --frozen: --frozen silently installs a stale lock.
      - name: Install dependencies
        if: inputs.uv-sync
        run: uv sync --dev --locked

      # The matrix value is in the step name too: Forgejo does not always
      # render the job name.
      - name: Build ${{ inputs.matrix-value }}
        run: ${{ inputs.build }}

      # clang-tidy, not a clang build: -Wdocumentation is clang-only, and
      # clang-tidy reads the database the gcc build wrote. -header-filter
      # because doxygen lives in the headers; the two -Wno- silence clang about
      # gcc-only options of a cross database.
      - name: clang-tidy ${{ inputs.matrix-value }}
        if: inputs.clang-tidy
        env:
          DB_DIR: ${{ inputs.compile-commands-dir }}
          FILES: ${{ inputs.clang-tidy-files }}
        run: |
          if [ ! -f "$DB_DIR/compile_commands.json" ]; then
            echo "no $DB_DIR/compile_commands.json: have the build write it, or set clang-tidy: false" >&2
            exit 1
          fi
          clang-tidy --version
          # run-clang-tidy is not on the PATH: it sits next to the real clang-tidy.
          "$(dirname "$(readlink -f "$(command -v clang-tidy)")")/run-clang-tidy" \
            -p "$DB_DIR" -quiet -warnings-as-errors='*' -header-filter='.*' \
            -extra-arg=-Wdocumentation \
            -extra-arg=-Wno-unknown-warning-option \
            -extra-arg=-Wno-unused-command-line-argument \
            "$FILES"

      # Expands artifact-path the way the upload does, so a pattern matching
      # nothing fails here with its name. No `| head`: under pipefail, a
      # truncated pipe fails the step once the listing is long.
      - name: Show what was produced
        if: inputs.artifact-name != ''
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          shopt -s globstar nullglob
          # One pattern per line: the unquoted expansion below globs, never splits.
          IFS=$'\n'
          paths=()
          while read -r pattern; do
            [ -n "$pattern" ] || continue
            matches=($pattern)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "artifact-path: nothing matches '$pattern'" >&2
              exit 1
            fi
            paths+=("${matches[@]}")
          done <<< "$ARTIFACT_PATH"
          du -shc -- "${paths[@]}" | tail -n 1
          echo "$(find "${paths[@]}" -type f | wc -l) files"

      # Forgejo's fork: GitHub's upload-artifact refuses to run outside
      # github.com.
      - name: Upload artifact
        if: inputs.artifact-name != ''
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
