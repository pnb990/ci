---

# Builds a Debian package from its `debian/` directory, checks it, and on a
# release tag publishes it to the owner's Debian registry on this forge.
#
# Everything a package-specific workflow would take as input is already in
# `debian/`: the build dependencies in `debian/control`, the version in
# `debian/changelog`, the tests in `debian/tests/`. So the only input is the
# image, and the steps are the ones Debian itself runs on a package:
#
#   build-dep -> dpkg-buildpackage -> lintian -> install -> purge -> autopkgtest
#
# The image is `debian-pkg:ci` from soft-lib/docker-images: build-essential,
# debhelper, dpkg-dev, lintian and autopkgtest. A package's own Build-Depends
# are not in it; they are installed here from its `debian/control`. The
# distribution the package is built for, and published to, is the image's.
#
# Publishing happens only on a `v*` tag, which is the caller's trigger to
# decide, and needs the PACKAGE_TOKEN secret. The registry is per owner and a
# published version is immutable, so the tag must be the changelog's version:
# a new build is a new `debian/changelog` entry, never a re-pushed tag.
#
# PACKAGE_TOKEN is a token with write:package on the repository owner. It is
# not declared under `workflow_call`: Forgejo only accepts `inputs` and
# `outputs` there, and rejects the whole workflow otherwise. A called workflow
# sees no secret of its caller unless the calling job passes it:
#
#   uses: soft-lib/ci/.forgejo/workflows/deb-build.yaml@<sha>
#   secrets:
#     PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}   # or `secrets: inherit`
#
# A caller that never tags can leave it out.
#
# A backport has no `debian/` of its own: the caller gives the URL of a
# Debian source package (`dsc`) and its sha256, and that package is
# rebuilt for the image's distribution, under a `~bpo<release>+1` entry.

"on":
  workflow_call:
    inputs:
      image:
        description: >-
          Full reference of the image, pinned to a commit tag:
          `pnb990/debian-pkg:ci-<sha>`. Stays in the calling project: a pin is
          a commit in the repository it protects.
        type: string
        required: true
      dsc:
        description: >-
          URL of a Debian source package to backport instead of the caller's
          own `debian/`, on snapshot.debian.org: the archive drops a version
          once the suite moves on, snapshot keeps it. Its files are fetched
          from the same directory. Empty builds the caller's tree.
        type: string
        default: ""
      dsc-sha256:
        description: >-
          sha256 of the `.dsc`, required with `dsc`. The `.dsc` holds the
          checksums of the tarballs, so pinning it pins them all.
        type: string
        default: ""

jobs:
  deb-build:
    runs-on: debian
    container:
      image: ${{ inputs.image }}

    steps:
      - name: Image provenance
        run: |
          cat /etc/image-info 2>/dev/null \
            || echo "no /etc/image-info: pin not bumped with the rename, or image older than the stamp"

      # Into `source/`, as sbuild and salsa-ci do: dpkg-buildpackage writes
      # its results next to the source tree, in `..`, and has no option to
      # put them elsewhere (only `dh_builddeb --destdir`, which is the
      # package's debian/rules to decide). With the tree one level down,
      # `..` is the job's own workspace: the results land there, and nothing
      # else does.
      - name: Checkout
        if: inputs.dsc == ''
        uses: actions/checkout@v6
        with:
          path: source

      # dpkg-source checks the tarballs against the .dsc, the .dsc is checked
      # against the caller's pin; its signature is not checked, as the image
      # has no Debian keyring. The version and distribution are given to dch
      # rather than left to --bpo, which guesses them from distro-info.
      - name: Fetch and extract the source package
        if: inputs.dsc != ''
        env:
          DSC: ${{ inputs.dsc }}
          DSC_SHA256: ${{ inputs.dsc-sha256 }}
          DEBFULLNAME: ${{ github.repository_owner }}
        run: |
          if [ -z "$DSC_SHA256" ]; then
              echo "::error::dsc given without dsc-sha256"
              exit 1
          fi
          # The forge's own host: lintian flags a localhost address.
          export DEBEMAIL="${DEBFULLNAME}@${GITHUB_SERVER_URL#*://}"
          apt-get update
          apt-get install -y --no-install-recommends curl devscripts
          dsc=$(basename "$DSC")
          curl --fail --silent --show-error --location --output "$dsc" "$DSC"
          echo "$DSC_SHA256  $dsc" | sha256sum --check
          sed -n '/^Checksums-Sha256:/,/^[^ ]/s/^ [0-9a-f]* [0-9]* //p' "$dsc" |
              while read -r file; do
                  curl --fail --silent --show-error --location --output "$file" "$(dirname "$DSC")/$file"
              done
          dpkg-source -x "$dsc" source
          . /etc/os-release
          cd source
          # A ~bpo version sorts before the one it backports, which dch
          # refuses without --force-bad-version: newer than the image's own
          # package, older than the original, as every Debian backport.
          dch --newversion "$(dpkg-parsechangelog -S Version)~bpo${VERSION_ID}+1" \
              --force-bad-version \
              --distribution "${VERSION_CODENAME}-backports" --force-distribution \
              "Rebuild for ${VERSION_CODENAME}-backports."

      # `build-dep ./` reads the Build-Depends of the checked-out
      # debian/control: no deb-src line needed, and nothing package-specific
      # in the image.
      - name: Install the build dependencies
        working-directory: source
        run: |
          apt-get update
          apt-get build-dep -y ./

      # dh_auto_test runs the package's unit tests here, on one core: no -J,
      # the runner shares its host with other services.
      - name: Build
        id: build
        working-directory: source
        run: |
          dpkg-buildpackage -us -uc -b
          for deb in ../*.deb; do
              dpkg-deb --info "$deb"
              dpkg-deb --contents "$deb"
          done
          echo "source=$(dpkg-parsechangelog -S Source)" >> "$FORGEJO_OUTPUT"

      # Warnings fail too: Debian treats them as bugs, and a warning left in
      # becomes the noise that hides the next one.
      - name: Lintian
        run: lintian --allow-root --fail-on error,warning ./*.changes

      # The maintainer scripts' test, in piuparts' order: install, then purge,
      # before autopkgtest. Non-interactive: debconf takes every default, as
      # on a fresh host.
      - name: Install
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y ./*.deb

      - name: Purge
        run: |
          packages=""
          for deb in ./*.deb; do
              packages="$packages $(dpkg-deb -f "$deb" Package)"
          done
          # shellcheck disable=SC2086 # one word per package
          DEBIAN_FRONTEND=noninteractive apt-get purge -y $packages

      # Last, because autopkgtest installs what a test depends on itself
      # (`Depends: @`) and a test may remove the package again: nothing runs
      # after it on the package. `null` runs the tests right here, in the
      # job's container, which is already the throw-away testbed autopkgtest
      # would otherwise create. Given the .debs, it tests these binaries
      # rather than the archive's. A package without debian/tests/ says so in
      # the log rather than showing a skipped step.
      - name: autopkgtest
        run: |
          if [ -f source/debian/tests/control ]; then
              autopkgtest ./*.deb source/ -- null
          else
              echo "no debian/tests/control: nothing to run"
          fi

      # Forgejo's fork: GitHub's own upload-artifact refuses to run off
      # github.com (see fw-build.yaml).
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: ${{ steps.build.outputs.source }}-deb
          path: ./*.deb
          if-no-files-found: error

      # The tag is compared with the changelog after DEP-14 mangling (`~` ->
      # `_`, `:` -> `%`), the characters a Debian version may hold and a git
      # tag may not. 409 means the version is already published: it is not
      # overwritten, the changelog has to move on.
      - name: Publish to the Debian registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          REGISTRY: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/debian
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dpkg-parsechangelog -l source/debian/changelog -S Version | sed -e 's/~/_/g' -e 's/:/%/g')
          if [ "$TAG" != "v$version" ]; then
              echo "::error::tag $TAG does not match debian/changelog version $version"
              exit 1
          fi
          if [ -z "$PACKAGE_TOKEN" ]; then
              echo "::error::release tag but no PACKAGE_TOKEN secret passed by the caller"
              exit 1
          fi
          . /etc/os-release
          for deb in ./*.deb; do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --header "Authorization: token ${PACKAGE_TOKEN}" \
                  --upload-file "$deb" "${REGISTRY}/pool/${VERSION_CODENAME}/main/upload")
              case "$status" in
                  201) echo "published $(basename "$deb") to ${REGISTRY} ${VERSION_CODENAME}/main" ;;
                  409) echo "::notice::$(basename "$deb") already published; add a debian/changelog entry to publish a new build" ;;
                  *) echo "::error::$(basename "$deb"): upload failed, HTTP ${status}"; exit 1 ;;
              esac
          done
